<!DOCTYPE html>
<html>
<head>
  <title>Google Login</title>
  <!-- ضع هنا الـ Client ID الخاص بك من Google Cloud Console -->
  <meta name="google-signin-client_id"
        content="133843511650-am6noca4q3m9onveuji00dhb458otu8k.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google Sign-In Demo</h2>

  <!-- إعداد زر Google -->
  <div id="g_id_onload"
       data-client_id="133843511650-am6noca4q3m9onveuji00dhb458otu8k.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    function handleCredentialResponse(response) {
      const token = response.credential;
      console.log("Google ID Token:", token);

      // ✅ رجّع التوكن إلى Adalo عبر Deep Link
      window.location.href = "adalo://google-login?token=" + token;
    }
  </script>
</body>
</html>
