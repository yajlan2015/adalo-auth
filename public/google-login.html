<!DOCTYPE html>
<html>
<head>
  <title>Google Login</title>
  <meta name="google-signin-client_id"
        content="133843511650-am6noca4q3m9onveuji00dhb458otu8k.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google Sign-In Demo</h2>
  <div id="g_id_onload"
       data-client_id="133843511650-am6noca4q3m9onveuji00dhb458otu8k.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    async function handleCredentialResponse(response) {
      const token = response.credential;
      console.log("Google ID Token:", token);

      try {
        const res = await fetch("https://adalo-auth-seven.vercel.app/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        const data = await res.json();
        console.log("Backend Response:", data);
        alert("Welcome " + data.name);
      } catch (err) {
        console.error("Error:", err);
        alert("Login failed");
      }
    }
  </script>
</body>
</html>
