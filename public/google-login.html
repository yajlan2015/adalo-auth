<!DOCTYPE html>
<html>
<head>
  <title>Google Login Test</title>
  <!-- Load Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- Google Sign-In button will render here -->
  <div id="googleSignInDiv"></div>

  <script>
    // Callback when Google returns a credential
    function handleCredentialResponse(response) {
      const idToken = response.credential; // <-- Real Google ID token
      console.log("Google ID Token:", idToken);

      // Send token to your backend for verification
      fetch("https://adalo-auth-nine.vercel.app/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: idToken })
      })
      .then(res => res.json())
      .then(data => {
        console.log("Backend response:", data);
        alert("Login success: " + JSON.stringify(data));
        // Here you can handle login success (e.g., redirect, save user info)
      })
      .catch(err => console.error("Error:", err));
    }

    // Initialize Google Sign-In
    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "133843511650-am6noca4q3m9onveuji00dhb458otu8k.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleSignInDiv"),
        { theme: "outline", size: "large" }
      );
      google.accounts.id.prompt(); // Optional: shows the One Tap prompt
    };
  </script>
</body>
</html>
