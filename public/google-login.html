<!DOCTYPE html>
<html>
<head>
  <title>Google Login Test</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="googleSignInDiv"></div>

  <script>
    function handleCredentialResponse(response) {
      const idToken = response.credential;
      console.log("Google ID Token:", idToken);

      // استخراج البيانات من التوكن مباشرة
      const payload = JSON.parse(atob(idToken.split('.')[1]));
      const email = payload.email;
      const name = payload.name;
      const picture = payload.picture;

      // إرسال التوكن + البيانات للـ Backend
      fetch("https://adalo-auth-5jki.vercel.app/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token: idToken,
          email: email,
          name: name,
          picture: picture
        })
      })
      .then(res => res.json())
      .then(data => {
        console.log("Backend response:", data);
        alert("Login success: " + JSON.stringify(data));
      })
      .catch(err => console.error("Error:", err));
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "133843511650-am6noca4q3m9onveuji00dhb458otu8k.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleSignInDiv"),
        { theme: "outline", size: "large" }
      );
      google.accounts.id.prompt();
    };
  </script>
</body>
</html>
